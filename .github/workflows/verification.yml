name: Vérification du site

on:
  # Les TROIS branches permanentes, et non la seule master. Le travail se fait
  # sur dev : n'ecouter que master revenait a ne rien verifier avant la fusion
  # finale, c'est-a-dire au moment ou une regression coute le plus cher a
  # demeler.
  push:
    branches: [master, preprod, dev]
  pull_request:

jobs:
  verifier:
    name: Contrôles de non-régression
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Références, données structurées, formulaires, syntaxe
        run: python3 tools/verifier-site.py

      - name: Le backoffice est-il à jour vis-à-vis de ses sources ?
        run: |
          # Les maquettes sont generees par _build/. Si le HTML versionne
          # differe de ce que produisent les scripts, c'est qu'une modification
          # a ete faite a la main et sera perdue a la prochaine generation.
          cd maquettes-backoffice && python3 _build/build.py > /dev/null
          cd .. && git diff --exit-code --stat maquettes-backoffice/ || {
            echo "::error::Le backoffice versionne ne correspond plus a ses scripts."
            echo "Relancez : cd maquettes-backoffice && python3 _build/build.py"
            exit 1
          }

  tests-laravel:
    name: Tests Laravel
    runs-on: ubuntu-latest

    # MySQL 9.7 LTS est la version supportee (app/Support/MoteurDeBase.php, qui
    # dit pourquoi). Changer cette image sans changer la constante fait echouer
    # l'etape « Version de MySQL » ci-dessous : les deux vont ensemble.
    #
    # L'image est epinglee sur la version EXACTE de la production
    # (docs/DEPLOIEMENT_RAILWAY.md, § 2) : la CI teste ce que sert le site, et
    # non la derniere 9.7 parue. Monter la production d'un correctif, c'est
    # changer les deux ensemble. La CI a teste 8.0 pendant que la production
    # tournait sur 9.4, sans que rien ne le signale ; la production est en
    # 9.7.2 depuis le 1er octobre 2026.
    services:
      mysql:
        image: mysql:9.7.2
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: sci4k_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping" --health-interval=10s
          --health-timeout=5s --health-retries=5

    defaults:
      run:
        working-directory: app-laravel

    steps:
      - uses: actions/checkout@v7

      - name: Installer PHP
        # Epinglee par empreinte de commit, et non par etiquette : une
        # etiquette se deplace, et « v2 » designerait alors un autre code sans
        # que rien ne change ici. Les actions actions/* viennent de GitHub
        # lui-meme ; celle-ci est tierce.
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, pdo_sqlite, gd, intl

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app-laravel/package-lock.json

      # Sans cette etape, tout test rendant une page d'administration echoue
      # sur « Vite manifest not found » : les vues appellent @vite et
      # public/build n'est pas versionne. L'echec accuserait les tests plutot
      # que la CI, ce qui coute une heure a comprendre.
      - name: Assembler les ressources
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Preparer l'environnement
        run: cp .env.example .env

      - name: Installer les dependances PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generer la cle d'application
        run: php artisan key:generate

      # Depose dans public/ les styles, le script et les images du site statique,
      # comme le fait la construction de l'image : la suite teste le site tel
      # qu'il sera servi. Sans cette etape, ces fichiers n'existent pas sur un
      # depot fraichement clone.
      - name: Deposer les ressources du site statique
        working-directory: .
        run: ./tools/sync-frontoffice.sh

      # Le formatage et l'analyse AVANT les tests : ils durent quelques
      # secondes, la suite en dure cinquante. Un oubli de formatage n'a pas a
      # se faire attendre une minute pour etre signale.
      #
      # Ces deux controles ne tournaient nulle part. Le seul workflow qui les
      # appelait vivait dans app-laravel/.github/workflows/, un dossier que
      # GitHub ne lit pas — il ne lit que celui de la RACINE — et visait par
      # surcroit une branche « main » qui n'existe pas. Il a ete retire, et sa
      # dette soldee : Pint est vert, phpstan est a zero. Ils peuvent donc
      # bloquer une fusion, ce qu'ils n'ont jamais pu faire.
      - name: Formatage (Pint)
        run: composer lint:check

      - name: Analyse statique (phpstan)
        run: composer types:check

      # Deux passes, et c'est deliberé. phpunit.xml impose SQLite en memoire :
      # rapide, mais ce n'est pas le moteur servi en production. Une variable
      # d'environnement reelle prime sur phpunit.xml — verifie — ce qui permet
      # de rejouer la meme suite contre MySQL et d'y attraper les ecarts de
      # dialecte, l'enum de statut au premier chef.
      - name: Tests sur SQLite
        run: php artisan test

      - name: Tests sur MySQL 9.7, la version supportee
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: sci4k_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

      # L'image ci-dessus doit etre celle que le projet declare supporter.
      - name: Version de MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: sci4k_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan base:verifier-version
