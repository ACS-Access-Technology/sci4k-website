# Perimetre de l'analyse SonarCloud.
#
# L'analyse portait sur 59 385 lignes reparties en 547 fichiers, dont plus de la
# moitie n'est pas le produit livre : 20 999 lignes de CSS et 11 158 de HTML
# appartiennent aux deux dossiers de maquettes, qui servent de reference
# visuelle et ne sont pas deployees.
#
# Le HTML de maquettes-backoffice/ est GENERE par _build/build.py, et le README
# interdit de le modifier a la main — un controle d'integration verifie meme
# qu'il correspond toujours a ses scripts. Une duplication qu'on ne peut pas
# corriger n'est pas un signal : c'est du bruit permanent.
#
# Quant aux pages de maquettes-frontoffice/, elles partagent en-tete,
# navigation et pied de page, d'ou 40 a 60 % de duplication chacune. C'est le
# comportement normal d'un site statique, pas un defaut.
#
# Le renommage frontoffice/ -> maquettes-frontoffice/ du 31 aout a fait basculer
# tous ces fichiers en « code nouveau » aux yeux de SonarCloud, ce qui a porte la
# duplication du code nouveau a 3,2 % pour un seuil de 3 % et fait echouer la
# porte de qualite — sans qu'aucune ligne du produit n'y soit pour rien.
#
# Ce fichier ne desactive aucune regle : il dit seulement ou est le produit.
# app-laravel/ et tools/ restent integralement analyses, tests compris.
sonar.exclusions=maquettes-frontoffice/**,maquettes-backoffice/**,demo/**,antigravity-workspace/**
