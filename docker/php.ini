; Reglages PHP de l'image SCI4K.
;
; L'image FrankenPHP ne charge AUCUN php.ini par defaut : PHP repart alors sur
; ses valeurs d'usine, dont upload_max_filesize a 2 Mo. Les ecrans
; d'administration, eux, annoncent accepter jusqu'a 4 Mo.
;
; Entre les deux se trouvait un trou silencieux : une image de 3 Mo etait
; transferee en entier par le navigateur, puis jetee par PHP avant d'atteindre
; Laravel. Ni validation, ni exception, ni ligne de journal — le backoffice
; affichait « Envoi en cours… » un long moment, puis « le fichier n'a pas pu
; etre envoye ». Le defaut ne se voyait pas en developpement, ou php.ini est
; genereux, et frappait les seuls champs qui sautent le recadrage : fonds de
; section et logos de partenaires, c'est-a-dire precisement les plus lourds.
;
; tests/Feature/LimitesDeTeleversementTest.php confronte ces valeurs aux regles
; du code : elles ne peuvent plus diverger sans que la suite le dise.

; Le fichier lui-meme. Large devant la regle de 4 Mo : mieux vaut que Laravel
; refuse proprement, avec un message, que PHP en silence.
upload_max_filesize = 12M

; La requete ENTIERE, fichier et champs compris. Elle doit depasser la ligne
; ci-dessus : reglee a l'identique, elle refuserait un fichier pourtant admis
; parce que les champs qui l'accompagnent debordent les derniers octets. Et ce
; refus-la est pire — PHP vide $_POST, la requete echoue sur un jeton CSRF
; manquant, et rien ne designe la vraie cause.
post_max_size = 16M

; De la marge pour deplacer un televersement, sans ouvrir la porte a un
; processus qui s'emballe.
memory_limit = 256M

; Le fuseau de l'agence. Sans lui, PHP avertit et retombe sur UTC : les dates
; ecrites hors d'Eloquent seraient decalees d'une heure une partie de l'annee.
date.timezone = UTC

; La version de PHP n'a pas a s'annoncer dans les en-tetes : c'est un
; renseignement offert a qui cherche une faille connue.
expose_php = Off

; LES COOKIES DE SESSION DE PHP.
;
; Laravel gere les siens et ne passe pas par ces reglages — il lit
; config/session.php, ou SESSION_SECURE_COOKIE est deja pose. Mais les valeurs
; d'usine de PHP restent celles du moteur, et toute bibliotheque tierce qui
; ouvrirait une session native repartirait dessus : un cookie lisible en
; JavaScript et transmis en clair.
;
; Les aligner ne coute rien et supprime un ecart entre ce que le framework
; promet et ce que le moteur ferait sans lui.
session.cookie_httponly = 1
session.cookie_secure = 1
session.cookie_samesite = Lax

; Refuse un identifiant de session que le client aurait choisi lui-meme —
; la parade a la fixation de session.
session.use_strict_mode = 1
